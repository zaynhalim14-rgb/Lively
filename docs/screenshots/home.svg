<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="screen"><rect x="8" y="8" width="374" height="828" rx="46"/></clipPath>
  </defs>
  <g font-family="-apple-system, Helvetica, Arial, sans-serif">
    <!-- Device frame -->
    <rect x="0" y="0" width="390" height="844" rx="54" fill="#1B1F27"/>
    <g clip-path="url(#screen)">
      <rect x="8" y="8" width="374" height="828" fill="#F7F8FA"/>

      <!-- Status bar -->
      <text x="52" y="46" font-size="15" font-weight="600" fill="#1B1F27">9:41</text>
      <g fill="#1B1F27">
        <rect x="292" y="42" width="3" height="4" rx="1"/>
        <rect x="297" y="40" width="3" height="6" rx="1"/>
        <rect x="302" y="38" width="3" height="8" rx="1"/>
        <rect x="307" y="36" width="3" height="10" rx="1"/>
      </g>
      <g stroke="#1B1F27" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M316 41 a8 8 0 0 1 12 0"/>
        <path d="M319 44 a4.4 4.4 0 0 1 6 0"/>
      </g>
      <circle cx="322" cy="46.5" r="1.6" fill="#1B1F27"/>
      <rect x="336" y="36" width="22" height="11" rx="3.5" fill="none" stroke="#1B1F27" stroke-width="1.5"/>
      <rect x="338" y="38" width="14" height="7" rx="2" fill="#1B1F27"/>
      <rect x="359.5" y="39" width="2" height="5" rx="1" fill="#1B1F27"/>
      <!-- Dynamic island -->
      <rect x="132" y="22" width="126" height="36" rx="18" fill="#14161A"/>

      <!-- Hero: coral circle with live-photo glyph -->
      <circle cx="195" cy="286" r="70" fill="#FF6B6B"/>
      <circle cx="195" cy="286" r="44" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 7.2"/>
      <circle cx="195" cy="286" r="27" fill="none" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="195" cy="286" r="11" fill="#FFFFFF"/>

      <text x="195" y="408" text-anchor="middle" font-size="30" font-weight="700" fill="#1B1F27">Lively</text>
      <text x="195" y="434" text-anchor="middle" font-size="13" font-weight="500" fill="#6B7280">Give your Live Photos a life of their own.</text>

      <!-- Primary button -->
      <rect x="24" y="560" width="342" height="52" rx="14" fill="#FF6B6B"/>
      <g stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="104" y="578" width="18" height="15" rx="3"/>
        <path d="M104 589 l5 -5 4 4 5 -6 4 5"/>
      </g>
      <circle cx="110" cy="582.5" r="1.6" fill="#FFFFFF"/>
      <text x="209" y="591" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">Choose a Live Photo</text>

      <!-- Secondary button -->
      <rect x="24" y="624" width="342" height="52" rx="14" fill="#EEF0F4" stroke="#E2E5EA" stroke-width="1"/>
      <g stroke="#1B1F27" stroke-width="1.8" fill="none" stroke-linejoin="round">
        <rect x="72" y="642" width="16" height="16" rx="3"/>
        <line x1="76" y1="642" x2="76" y2="658"/>
        <line x1="84" y1="642" x2="84" y2="658"/>
        <line x1="76" y1="647" x2="84" y2="647"/>
        <line x1="76" y1="653" x2="84" y2="653"/>
      </g>
      <text x="228" y="655" text-anchor="middle" font-size="15" font-weight="600" fill="#1B1F27">Turn a Video into a Live Photo</text>

      <!-- Feature cards -->
      <!-- Card 1: Vivid Filters -->
      <rect x="24" y="700" width="106" height="100" rx="14" fill="#FFFFFF" stroke="#E2E5EA" stroke-width="1"/>
      <g stroke="#FF6B6B" stroke-width="2" fill="none">
        <circle cx="40" cy="722" r="5"/>
        <circle cx="48" cy="722" r="5"/>
        <circle cx="44" cy="715" r="5"/>
      </g>
      <text x="38" y="752" font-size="10" font-weight="600" fill="#1B1F27">Vivid Filters</text>
      <text x="38" y="768" font-size="8.5" font-weight="500" fill="#6B7280">Looks that move</text>
      <text x="38" y="780" font-size="8.5" font-weight="500" fill="#6B7280">with you.</text>

      <!-- Card 2: Add Soundtrack -->
      <rect x="142" y="700" width="106" height="100" rx="14" fill="#FFFFFF" stroke="#E2E5EA" stroke-width="1"/>
      <circle cx="158" cy="726" r="4" fill="#3D7DFF"/>
      <line x1="161.5" y1="726" x2="161.5" y2="711" stroke="#3D7DFF" stroke-width="2" stroke-linecap="round"/>
      <path d="M161.5 711 q6 1.5 6 7" fill="none" stroke="#3D7DFF" stroke-width="2" stroke-linecap="round"/>
      <text x="156" y="752" font-size="10" font-weight="600" fill="#1B1F27">Add Soundtrack</text>
      <text x="156" y="768" font-size="8.5" font-weight="500" fill="#6B7280">Music or a</text>
      <text x="156" y="780" font-size="8.5" font-weight="500" fill="#6B7280">voiceover.</text>

      <!-- Card 3: Re-Live It -->
      <rect x="260" y="700" width="106" height="100" rx="14" fill="#FFFFFF" stroke="#E2E5EA" stroke-width="1"/>
      <circle cx="281" cy="721" r="8" fill="none" stroke="#FFB84C" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3.1"/>
      <circle cx="281" cy="721" r="3" fill="#FFB84C"/>
      <text x="274" y="752" font-size="10" font-weight="600" fill="#1B1F27">Re-Live It</text>
      <text x="274" y="768" font-size="8.5" font-weight="500" fill="#6B7280">Save a new</text>
      <text x="274" y="780" font-size="8.5" font-weight="500" fill="#6B7280">Live Photo.</text>

      <!-- Home indicator -->
      <rect x="128" y="820" width="134" height="5" rx="2.5" fill="#1B1F27"/>
    </g>
  </g>
</svg>
